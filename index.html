<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ricettario · Michele Di Leva</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}

:root{
  --ink:#1A1410;--ink2:#2E2820;--ink3:#3D3528;
  --gold:#B8860B;--gold2:#C9960E;--gold3:#DAA620;
  --gold-glow:rgba(184,134,11,0.15);--gold-rim:rgba(184,134,11,0.25);
  --cream:#FAF5E8;--cream2:#F3EDD8;--cream3:#E9E0C8;
  --smoke:#7A7260;--smoke2:#ADA598;--smoke3:#D0C8B8;
  --white:#FDFAF2;
  --card-bg:#FFFFFF;
  --ctrl-bg:#F0E8D4;--ctrl-border:rgba(184,134,11,0.28);
  --shadow-sm:0 1px 3px rgba(20,18,12,0.08);
  --shadow-md:0 4px 16px rgba(20,18,12,0.10);
  --shadow-lg:0 8px 32px rgba(20,18,12,0.14);
  --r:4px;
  --font-serif:Georgia,'Times New Roman',serif;
  --font-sans:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
}
[data-dark]{
  --ink:#F5F0E4;--ink2:#D8D0C0;--ink3:#B8B0A0;
  --cream:#161410;--cream2:#1E1C18;--cream3:#262420;
  --smoke:#686050;--smoke2:#484038;--smoke3:#302820;
  --white:#1E1C18;--card-bg:#1E1C18;
  --ctrl-bg:#161410;--ctrl-border:rgba(184,134,11,0.22);
  --shadow-sm:0 1px 3px rgba(0,0,0,0.3);
  --shadow-md:0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.55);
}

body{
  background:var(--cream);color:var(--ink);
  font-family:var(--font-serif);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  padding-bottom:env(safe-area-inset-bottom);
}

/* ── HEADER ── */
.hd{
  text-align:center;
  padding:clamp(1.6rem,5vw,2.8rem) 1.2rem 0;
  background:linear-gradient(180deg,var(--cream) 0%,var(--cream2) 100%);
  border-bottom:1px solid var(--ctrl-border);
  position:relative;
}
.hd-corner{
  position:absolute;top:1.1rem;right:1.1rem;
}
.theme-btn{
  background:var(--ctrl-bg);
  border:1px solid var(--ctrl-border);
  border-radius:20px;padding:.32rem .72rem;
  cursor:pointer;
  font-family:var(--font-sans);font-size:.62rem;letter-spacing:.1em;
  color:var(--smoke);
  display:inline-flex;align-items:center;gap:.35rem;
  -webkit-tap-highlight-color:transparent;
  transition:background .2s;
}
.theme-btn:active{background:var(--gold-glow)}

/* chef photo */
.photo-frame{
  width:clamp(96px,22vw,148px);
  height:clamp(96px,22vw,148px);
  border-radius:50%;
  background:var(--white);
  border:2px solid var(--gold2);
  box-shadow:0 0 0 5px var(--gold-glow),var(--shadow-lg);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  margin:0 auto .9rem;
  position:relative;
}
.photo-frame::after{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 30% 25%, rgba(255,255,255,0.12), transparent 60%);
  pointer-events:none;
}
.photo-frame img{
  width:100%;height:100%;
  border-radius:50%;object-fit:cover;display:block;
}
.eyebrow{
  font-family:var(--font-sans);
  font-size:.58rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--gold2);margin-bottom:.35rem;
  display:flex;align-items:center;justify-content:center;gap:.55rem;
}
.eyebrow::before,.eyebrow::after{
  content:'';width:20px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold2));
}
.eyebrow::after{background:linear-gradient(90deg,var(--gold2),transparent)}
.hd-name{
  font-size:clamp(2.8rem,12vw,4.4rem);
  font-weight:300;letter-spacing:.06em;
  color:var(--ink);line-height:1;
  text-align:center;margin:.6rem 0 .2rem;
}
.hd-name em{font-style:italic;color:var(--gold2);font-size:1.05em;font-weight:300}
.hd-sub{
  font-family:var(--font-sans);
  font-size:.58rem;letter-spacing:.16em;
  color:var(--smoke2);margin:.5rem 0 0;text-transform:uppercase;
}
.hd-ornament{
  display:flex;align-items:center;gap:.6rem;
  margin:1.2rem 0 0;opacity:.45;
}
.hd-ornament::before,.hd-ornament::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold));
}
.hd-ornament::after{background:linear-gradient(90deg,var(--gold),transparent)}
.hd-ornament span{color:var(--gold);font-size:.42rem;letter-spacing:.2em}

/* ── STICKY CONTROLS ── */
.ctrl-shell{
  position:-webkit-sticky;
  position:sticky;
  top:0;
  z-index:40;
  background:var(--cream2);
  border-bottom:1px solid var(--ctrl-border);
  box-shadow:0 2px 12px rgba(20,18,12,0.08);
}
.ctrl-row{
  max-width:1320px;margin:0 auto;
  padding:.75rem 1.1rem;
  display:flex;gap:.7rem;align-items:center;
  flex-wrap:nowrap;
}
/* search */
.search-wrap{flex:1;min-width:0;position:relative}
.search-wrap .ico{
  position:absolute;left:.8rem;top:50%;
  transform:translateY(-50%);
  color:var(--gold);pointer-events:none;
  width:14px;height:14px;
}
.search-inp{
  width:100%;
  background:var(--white);
  border:1.5px solid var(--ctrl-border);
  border-radius:var(--r);
  padding:.58rem .8rem .58rem 2.35rem;
  font-family:var(--font-serif);font-size:.92rem;color:var(--ink);
  outline:none;
  -webkit-appearance:none;appearance:none;
  -webkit-border-radius:var(--r);
  transition:border-color .18s,box-shadow .18s;
}
.search-inp::placeholder{color:var(--smoke2);font-style:italic}
.search-inp:focus{
  border-color:var(--gold2);
  box-shadow:0 0 0 3px rgba(184,134,11,.13);
}

/* dose */
.dose-box{
  display:flex;align-items:stretch;
  border:1.5px solid var(--ctrl-border);
  border-radius:var(--r);
  background:var(--white);overflow:hidden;
  flex-shrink:0;
}
.dose-lbl{
  padding:0 .6rem;
  font-family:var(--font-sans);
  font-size:.52rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--gold);border-right:1px solid var(--ctrl-border);
  display:flex;align-items:center;white-space:nowrap;
  background:var(--ctrl-bg);
}
.dose-btn{
  background:none;border:none;color:var(--smoke);
  width:34px;min-height:38px;
  cursor:pointer;font-size:1.05rem;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s,color .15s;
}
.dose-btn:active{background:var(--gold2);color:#fff}
.dose-val{
  background:none;border:none;color:var(--ink);
  font-family:var(--font-serif);font-size:1.05rem;
  width:3rem;text-align:center;outline:none;
  border-left:1px solid var(--ctrl-border);
  border-right:1px solid var(--ctrl-border);
}
.dose-val::-webkit-inner-spin-button,
.dose-val::-webkit-outer-spin-button{-webkit-appearance:none}

/* view toggle */
.view-btns{
  display:flex;border:1.5px solid var(--ctrl-border);
  border-radius:var(--r);overflow:hidden;flex-shrink:0;
}
.vbtn{
  background:var(--white);border:none;
  padding:.48rem .62rem;cursor:pointer;color:var(--smoke);
  display:flex;align-items:center;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s,color .15s;
}
.vbtn+.vbtn{border-left:1px solid var(--ctrl-border)}
.vbtn.on{background:var(--gold2);color:#fff}

/* category pills */
.cat-bar{
  max-width:1320px;margin:0 auto;
  padding:.5rem 1.1rem;
  display:flex;gap:.38rem;
  flex-wrap:nowrap;overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.cat-bar::-webkit-scrollbar{display:none}
.cpill{
  background:var(--white);
  border:1px solid var(--ctrl-border);
  border-radius:20px;padding:.28rem .78rem;
  font-family:var(--font-sans);
  font-size:.68rem;letter-spacing:.08em;
  color:var(--smoke);
  cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
  transition:background .15s,color .15s,border-color .15s;
}
.cpill.on{
  background:var(--gold2);
  border-color:var(--gold2);
  color:#fff;
}

/* count */
.count{
  max-width:1320px;margin:0 auto;
  font-family:var(--font-sans);
  font-size:.6rem;letter-spacing:.1em;
  color:var(--smoke2);
  text-align:right;padding:.4rem 1.2rem 0;
  text-transform:uppercase;
}

/* ── GRID ── */
.grid{
  max-width:1320px;margin:0 auto;
  padding:1.4rem 1.1rem 5rem;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:1.4rem;
}
.grid.list{grid-template-columns:1fr}

/* ── CARD ── */
.card{
  background:var(--card-bg);
  border:1px solid var(--ctrl-border);
  border-radius:8px;
  overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s,transform .2s;
  -webkit-transform:translateZ(0);
  transform:translateZ(0);
}
.card:hover{
  box-shadow:var(--shadow-md);
  transform:translateY(-1px);
}

/* gold top stripe */
.card-stripe{
  height:3px;
  background:linear-gradient(90deg,var(--gold),var(--gold2),var(--gold3),var(--gold2),var(--gold));
  background-size:200% 100%;
  flex-shrink:0;
}

.card-hd{
  background:var(--ink2);
  padding:.85rem 1.1rem .75rem;
  border-bottom:1.5px solid var(--gold);
}
.card-num{
  font-family:var(--font-sans);
  font-size:.5rem;letter-spacing:.28em;text-transform:uppercase;
  color:var(--gold2);margin-bottom:.22rem;
  display:flex;align-items:center;gap:.45rem;
}
.card-num::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg,rgba(184,134,11,.35),transparent);
}
.card-cat{
  font-family:var(--font-sans);font-size:.52rem;
  letter-spacing:.12em;text-transform:uppercase;
  color:rgba(184,134,11,.6);float:right;
  margin-top:.15rem;
}
.card-name{
  font-size:.98rem;font-weight:400;
  color:#FAF5E8;letter-spacing:.01em;line-height:1.3;
  clear:both;
}

/* table */
.tbl{width:100%;border-collapse:collapse}
.tbl thead tr{background:var(--cream3)}
.tbl thead th{
  font-family:var(--font-sans);
  font-size:.5rem;letter-spacing:.14em;text-transform:uppercase;
  font-weight:500;
  color:var(--smoke);padding:.44rem .8rem;
  text-align:left;border-bottom:1px solid var(--ctrl-border);
}
.tbl thead th.r{text-align:right}
.tbl thead th.sc{
  text-align:right;color:var(--gold2);
  background:rgba(184,134,11,.07);
  border-left:1px solid rgba(184,134,11,.18);
}
.tbl tbody tr{border-bottom:1px solid rgba(184,134,11,.07)}
.tbl tbody tr:last-child{border-bottom:none}
.tbl tbody tr:nth-child(even){background:rgba(184,134,11,.03)}
.tbl td{padding:.4rem .8rem;vertical-align:middle}
.td-n{font-size:.86rem;color:var(--ink)}
.td-b{font-size:.8rem;text-align:right;color:var(--smoke2)}
.td-u{font-size:.65rem;color:var(--smoke3);padding-left:.2rem;font-style:italic}
.td-s{
  font-size:.88rem;text-align:right;
  color:var(--gold2);
  background:rgba(184,134,11,.05);
  border-left:1px solid rgba(184,134,11,.14);
  padding-right:.9rem;font-style:italic;
}

/* empty */
.empty{
  grid-column:1/-1;text-align:center;
  padding:5rem 2rem;color:var(--smoke);
}
.empty-ico{font-size:2.5rem;opacity:.25;margin-bottom:.7rem}
.empty p{font-size:.9rem;font-style:italic;font-family:var(--font-sans)}

/* ── FAB ── */
.fab{
  position:fixed;
  bottom:calc(1.5rem + env(safe-area-inset-bottom));
  right:1.5rem;
  width:52px;height:52px;border-radius:50%;
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  border:none;cursor:pointer;
  font-size:1.5rem;color:#fff;z-index:60;
  box-shadow:0 4px 18px rgba(184,134,11,.45);
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s,box-shadow .15s;
}
.fab:active{transform:scale(.93);box-shadow:0 2px 10px rgba(184,134,11,.3)}

/* ── MODAL ── */
.modal-bg{
  display:none;position:fixed;inset:0;
  background:rgba(10,8,5,.75);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  z-index:80;
  align-items:flex-end;justify-content:center;
}
.modal-bg.open{display:flex}
.modal{
  background:var(--card-bg);
  border-radius:16px 16px 0 0;
  padding:1.3rem 1.3rem calc(1.8rem + env(safe-area-inset-bottom));
  width:100%;max-width:560px;
  max-height:88vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.modal-handle{
  width:36px;height:4px;border-radius:2px;
  background:var(--smoke3);margin:0 auto 1rem;
}
.modal h3{
  color:var(--gold2);font-size:1.15rem;
  font-weight:400;margin-bottom:1rem;
}
.modal label{
  display:block;
  font-family:var(--font-sans);
  font-size:.64rem;letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--smoke);margin:.8rem 0 .28rem;
}
.modal input,.modal select{
  width:100%;background:var(--ctrl-bg);
  border:1px solid var(--ctrl-border);
  border-radius:var(--r);
  color:var(--ink);padding:.5rem .7rem;
  font-size:.9rem;font-family:var(--font-serif);
  -webkit-appearance:none;appearance:none;outline:none;
  -webkit-border-radius:var(--r);
}
.modal input:focus,.modal select:focus{border-color:var(--gold2)}
.modal-actions{display:flex;gap:.7rem;margin-top:1.1rem}
.modal-actions button{
  flex:1;padding:.62rem;
  border-radius:var(--r);border:none;
  font-size:.9rem;cursor:pointer;
  font-family:var(--font-serif);
  -webkit-tap-highlight-color:transparent;
}
.btn-save-m{
  background:linear-gradient(135deg,var(--gold),var(--gold2));
  color:#fff;font-weight:600;
}
.btn-cancel-m{background:var(--ctrl-bg);color:var(--ink)}
.ing-list{margin:.45rem 0;display:flex;flex-direction:column;gap:.4rem}
.ing-row{
  display:grid;
  grid-template-columns:1fr .52fr .42fr auto;
  gap:.3rem;align-items:center;
}
.ing-row input{min-width:0}
.ing-row .rm{
  background:none;border:1px solid var(--ctrl-border);
  border-radius:var(--r);color:var(--smoke);
  padding:.28rem .48rem;cursor:pointer;
  font-size:.85rem;
  -webkit-tap-highlight-color:transparent;
}
.btn-add-ing{
  width:100%;background:none;
  border:1.5px dashed var(--gold);
  border-radius:var(--r);color:var(--gold2);
  padding:.42rem;cursor:pointer;font-size:.8rem;
  margin-top:.35rem;font-family:var(--font-serif);
  -webkit-tap-highlight-color:transparent;
}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .hd{padding:1.5rem 1rem 0}
  .hd-name{font-size:clamp(2.6rem,14vw,3.5rem)}
  .ctrl-row{padding:.6rem .9rem;gap:.5rem}
  .dose-lbl{display:none}
  .cat-bar{padding:.45rem .9rem}
  .grid{padding:1.2rem .9rem 5rem;gap:1rem;grid-template-columns:1fr}
}
@media(max-width:380px){
  .view-btns{display:none}
}

/* ── LANDING SCREEN ── */
.landing{
  position:fixed;inset:0;z-index:200;
  background:var(--cream);
  display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;
  padding:0;
  transition:opacity .4s ease;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.landing.gone{opacity:0;pointer-events:none}

/* Hero strip with logo */
.landing-hero{
  width:100%;
  background:linear-gradient(170deg, var(--cream2) 60%, var(--cream3) 100%);
  border-bottom:1px solid var(--gold-rim);
  display:flex;flex-direction:column;align-items:center;
  padding:2.4rem 1.5rem 1.8rem;
  position:relative;overflow:hidden;
}
.landing-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(184,134,11,.07) 0%, transparent 70%);
}
.landing-logo{
  width:clamp(100px,25vw,148px);
  height:clamp(100px,25vw,148px);
  border-radius:50%;
  background:#FAF5E8;
  border:2px solid var(--gold2);
  box-shadow:0 0 0 6px var(--gold-glow),0 16px 40px rgba(20,18,12,.13);
  overflow:hidden;flex-shrink:0;
  margin-bottom:1.1rem;
  position:relative;z-index:1;
}
.landing-logo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:50%}
.landing-eyebrow{
  font-family:var(--font-sans);
  font-size:.52rem;letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold2);margin-bottom:.3rem;
  display:flex;align-items:center;gap:.6rem;
  position:relative;z-index:1;
}
.landing-eyebrow::before,.landing-eyebrow::after{
  content:'';width:22px;height:1px;
  background:var(--gold2);opacity:.45;
}
.landing-name{
  font-size:clamp(2.2rem,9vw,3.4rem);font-weight:300;letter-spacing:.04em;
  color:var(--ink);line-height:1;margin-bottom:.25rem;text-align:center;
  position:relative;z-index:1;
}
.landing-name em{font-style:italic;color:var(--gold2)}
.landing-title{
  font-family:var(--font-sans);font-size:.5rem;
  letter-spacing:.22em;color:var(--smoke2);
  text-transform:uppercase;margin-bottom:0;text-align:center;
  position:relative;z-index:1;
}

/* Section picker */
.landing-body{
  width:100%;max-width:420px;
  padding:1.4rem 1.2rem 2.5rem;
  display:flex;flex-direction:column;align-items:center;gap:1rem;
}
.landing-prompt{
  font-family:var(--font-sans);font-size:.62rem;
  letter-spacing:.18em;color:var(--smoke);
  text-transform:uppercase;
  display:flex;align-items:center;gap:.6rem;
}
.landing-prompt::before,.landing-prompt::after{
  content:'';flex:1;height:1px;background:var(--gold-rim);
}
.section-grid{
  display:flex;flex-direction:column;gap:.55rem;
  width:100%;
}
.sbtn{
  display:flex;align-items:center;gap:.9rem;
  background:var(--card-bg);
  border:1.5px solid var(--ctrl-border);
  border-radius:12px;padding:.82rem 1.1rem;
  cursor:pointer;text-align:left;
  -webkit-tap-highlight-color:transparent;
  box-shadow:var(--shadow-sm);
  transition:border-color .2s,box-shadow .2s,transform .15s,background .2s;
  position:relative;overflow:hidden;
}
.sbtn::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--gold);opacity:0;
  transition:opacity .2s;
}
.sbtn:active,.sbtn:hover{
  border-color:var(--gold);
  box-shadow:0 4px 18px rgba(184,134,11,.13);
  transform:translateX(3px);
}
.sbtn:active::before,.sbtn:hover::before{opacity:1}
.sbtn-ico{font-size:1.6rem;line-height:1;flex-shrink:0}
.sbtn-txt{display:flex;flex-direction:column;gap:.12rem;flex:1}
.sbtn-label{
  font-family:var(--font-serif);font-size:1.05rem;font-weight:400;
  color:var(--ink);letter-spacing:.01em;
}
.sbtn-desc{
  font-family:var(--font-sans);font-size:.55rem;
  letter-spacing:.1em;color:var(--smoke2);text-transform:uppercase;
}
.sbtn-arr{font-size:.9rem;color:var(--gold2);opacity:.5;flex-shrink:0}
.sbtn.all{
  border-color:var(--gold);
  background:linear-gradient(135deg,rgba(184,134,11,.05),rgba(201,150,14,.03));
  margin-top:.2rem;
}
.sbtn.all .sbtn-label{color:var(--gold2)}
.sbtn.all .sbtn-arr{opacity:.8}
.back-btn{
  background:none;border:1px solid var(--ctrl-border);
  border-radius:20px;padding:.3rem .8rem;
  cursor:pointer;
  font-family:var(--font-sans);font-size:.6rem;letter-spacing:.1em;
  color:var(--smoke);text-transform:uppercase;
  display:inline-flex;align-items:center;gap:.35rem;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s;
}
.back-btn:active{background:var(--gold-glow)}

/* ─── Shared DB via JSONBin ─── */
var CU = [];


function sbHeaders() {
  return {
    'Content-Type': 'application/json',
    'apikey': SB_KEY,
    'Authorization': 'Bearer ' + SB_KEY
  };
}

function loadSharedRecipes() {
  fetch(SB_URL + '/rest/v1/ricette?select=id,data&order=id.asc', { headers: sbHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      CU = Array.isArray(rows) ? rows.map(function(row){ var r=row.data; r._c=true; r._id=row.id; return r; }) : [];
      buildCats(); render();
    })
    .catch(function(e){
      console.warn('Supabase load error, uso locale:', e);
      try { CU = JSON.parse(localStorage.getItem('rc_local') || '[]'); } catch(e2){ CU=[]; }
      CU.forEach(function(r){ r._c = true; });
      buildCats(); render();
    });
}

function saveRecipe(rec) {
  rec._c = true;
  fetch(SB_URL + '/rest/v1/ricette', {
    method: 'POST',
    headers: Object.assign({}, sbHeaders(), { 'Prefer': 'return=representation' }),
    body: JSON.stringify({ data: rec })
  })
  .then(function(r){ return r.json(); })
  .then(function(rows){
    if (Array.isArray(rows) && rows[0]) {
      rec._id = rows[0].id;
      CU.push(rec);
      buildCats(); render();
    } else {
      throw new Error(JSON.stringify(rows));
    }
  })
  .catch(function(e){
    console.error('Supabase save error:', e);
    try { var loc=JSON.parse(localStorage.getItem('rc_local')||'[]'); loc.push(rec); localStorage.setItem('rc_local',JSON.stringify(loc)); } catch(e2){}
    CU.push(rec);
    buildCats(); render();
    alert('Salvato in locale. Verifica la connessione.');
  });
}

function all() {
  var combined = R.concat(CU);
  if (curSec === 'tutti') return combined;
  return combined.filter(function(r){ return r.s === curSec; });
}

/* ─── Stato ─── */
var dose = 1, cat = 'Tutte', dark = false, curSec = 'colazioni';

/* ─── Utility ─── */
function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }
function fmtN(v) {
  if (v === null || v === undefined) return '';
  return (v === Math.floor(v)) ? String(v) : v.toFixed(1);
}
function fmtD(v, d) {
  if (v === null || v === undefined) return 'q.b.';
  var r = v * d;
  return (r === Math.floor(r)) ? String(r) : r.toFixed(1);
}

/* ─── Landing ─── */
function openSection(sec) {
  curSec = sec;
  cat = 'Tutte';
  var landing = document.getElementById('landing');
  if (landing) landing.classList.add('gone');
  // Update big title in header
  var hdName = document.querySelector('.hd-name em');
  if (hdName && SECTIONS[sec]) hdName.textContent = SECTIONS[sec].label;
  // Update sub-label
  var sl = document.getElementById('sec-lbl');
  if (sl && SECTIONS[sec]) sl.textContent = SECTIONS[sec].icon + ' ' + SECTIONS[sec].label;
  var msec = document.getElementById('msec');
  if (msec && sec !== 'tutti') msec.value = sec;
  buildCats(); render();
}

/* ─── Build Card ─── */
function buildCard(r, idx) {
  var card = el('div','card');
  card.appendChild(el('div','card-stripe'));
  var hd = el('div','card-hd');
  var num = el('div','card-num');
  num.textContent = 'Ricetta ' + (idx < 9 ? '0' : '') + (idx+1);
  if (r.c) { var ct = el('span','card-cat'); ct.textContent = r.c; num.appendChild(ct); }
  var nm = el('div','card-name');
  nm.textContent = r.n;
  if (r._c) { var st = el('span'); st.textContent = ' ★'; st.style.color='var(--gold2)'; nm.appendChild(st); }
  if (curSec === 'tutti' && r.s && SECTIONS[r.s]) {
    var sb = el('span','section-badge');
    sb.textContent = SECTIONS[r.s].icon + ' ' + SECTIONS[r.s].label;
    nm.appendChild(sb);
  }
  hd.appendChild(num); hd.appendChild(nm); card.appendChild(hd);

  var tbl = el('table','tbl');
  var thead = el('thead'); var hr = el('tr');
  var dL = (dose===Math.floor(dose))?String(dose):dose.toFixed(1);
  ['Ingrediente','Base','','× '+dL].forEach(function(h,i){
    var th=el('th'); th.textContent=h;
    if(i===1) th.className='r';
    if(i===3) th.className='sc';
    hr.appendChild(th);
  });
  thead.appendChild(hr); tbl.appendChild(thead);
  var tb = el('tbody');
  for(var i=0;i<r.i.length;i++){
    var ing=r.i[i], tr=el('tr');
    var tdN=el('td','td-n'); tdN.textContent=ing[0];
    var tdB=el('td','td-b'); tdB.textContent=fmtN(ing[1]);
    var tdU=el('td','td-u'); tdU.textContent=ing[2];
    var tdS=el('td','td-s');
    tdS.setAttribute('data-b',ing[1]===null?'':ing[1]);
    tdS.setAttribute('data-u',ing[2]);
    tdS.textContent=fmtD(ing[1],dose)+(ing[1]!==null?' '+ing[2]:'');
    tr.appendChild(tdN);tr.appendChild(tdB);tr.appendChild(tdU);tr.appendChild(tdS);
    tb.appendChild(tr);
  }
  tbl.appendChild(tb); card.appendChild(tbl);
  return card;
}

/* ─── Categories ─── */
function buildCats() {
  var bar = document.getElementById('catbar');
  if (!bar) return;
  bar.innerHTML = '';
  var a=all(), cats=['Tutte'];
  for(var i=0;i<a.length;i++) if(a[i].c && cats.indexOf(a[i].c)===-1) cats.push(a[i].c);
  for(var j=0;j<cats.length;j++) (function(c){
    var b=el('button','cpill'+(c===cat?' on':'')); b.textContent=c; b.type='button';
    b.addEventListener('click',function(){
      cat=c;
      document.querySelectorAll('.cpill').forEach(function(p){p.className='cpill';});
      b.className='cpill on'; render();
    });
    bar.appendChild(b);
  })(cats[j]);
}

/* ─── Render ─── */
function render() {
  var grid=document.getElementById('grid');
  if(!grid) return;
  grid.innerHTML='';
  var q=(document.getElementById('srch')||{value:''}).value.toLowerCase().trim();
  var out=all().filter(function(r){ return r.n.toLowerCase().indexOf(q)!==-1 && (cat==='Tutte'||r.c===cat); });
  var cd=document.getElementById('cnt');
  if(cd) cd.textContent=out.length+' / '+all().length+' ricette';
  if(!out.length){
    var em=el('div','empty'); em.style.gridColumn='1/-1';
    var ico=el('div','empty-ico'); ico.textContent='◌';
    var p=el('p'); p.textContent='Nessuna ricetta trovata';
    em.appendChild(ico); em.appendChild(p); grid.appendChild(em); return;
  }
  out.forEach(function(r,j){ grid.appendChild(buildCard(r,j)); });
}

/* ─── Dose ─── */
function updDose() {
  var dl=(dose===Math.floor(dose))?String(dose):dose.toFixed(1);
  document.querySelectorAll('.tbl thead th.sc').forEach(function(th){th.textContent='× '+dl;});
  document.querySelectorAll('.td-s').forEach(function(td){
    var b=td.getAttribute('data-b'),u=td.getAttribute('data-u');
    td.textContent=(b==='')?'q.b.':fmtD(parseFloat(b),dose)+' '+u;
  });
  var dv=document.getElementById('dval'); if(dv) dv.value=dose;
}

/* ─── Modal ─── */
function addIng(n,q,u){
  var row=el('div','ing-row');
  var ni=el('input');ni.type='text';ni.placeholder='Ingrediente';ni.value=n||'';ni.autocomplete='off';
  var qi=el('input');qi.type='number';qi.placeholder='Qt\u00e0';qi.value=q||'';qi.min='0';qi.step='any';qi.inputMode='decimal';
  var ui=el('input');ui.type='text';ui.placeholder='g / n\u00b0';ui.value=u||'';ui.autocomplete='off';
  var rm=el('button','rm');rm.type='button';rm.textContent='\u00d7';
  rm.addEventListener('click',function(){
    var il=document.getElementById('ilist');
    if(il&&il.children.length>1) il.removeChild(row);
  });
  row.appendChild(ni);row.appendChild(qi);row.appendChild(ui);row.appendChild(rm);
  document.getElementById('ilist').appendChild(row);
}
function resetModal(){ 
  var mn=document.getElementById('mn');if(mn)mn.value='';
  var il=document.getElementById('ilist');if(il){il.innerHTML='';addIng();}
  var msec=document.getElementById('msec');if(msec&&curSec!=='tutti')msec.value=curSec;
}
function openModal(){resetModal();document.getElementById('mbg').classList.add('open');}
function closeModal(){document.getElementById('mbg').classList.remove('open');}

/* ─── Init ─── */
function init() {
  // Landing
  document.querySelectorAll('.sbtn').forEach(function(btn){
    btn.addEventListener('click',function(){ openSection(btn.getAttribute('data-sec')); });
  });

  // Back
  var bb=document.getElementById('backbtn');
  if(bb) bb.addEventListener('click',function(){
    var landing=document.getElementById('landing');
    if(landing){ landing.classList.remove('gone'); cat='Tutte'; }
  });

  // Search
  var srch=document.getElementById('srch');
  if(srch) srch.addEventListener('input',render);

  // Dose
  var dv=document.getElementById('dval');
  if(dv) dv.addEventListener('change',function(){dose=Math.max(0.5,parseFloat(this.value)||1);updDose();});
  var dp=document.getElementById('dplus');if(dp)dp.addEventListener('click',function(){dose=Math.round((dose+0.5)*10)/10;updDose();});
  var dm=document.getElementById('dminus');if(dm)dm.addEventListener('click',function(){dose=Math.max(0.5,Math.round((dose-0.5)*10)/10);updDose();});

  // View
  var vg=document.getElementById('vgrid'),vl=document.getElementById('vlist');
  if(vg) vg.addEventListener('click',function(){document.getElementById('grid').classList.remove('list');vg.className='vbtn on';if(vl)vl.className='vbtn';});
  if(vl) vl.addEventListener('click',function(){document.getElementById('grid').classList.add('list');vl.className='vbtn on';if(vg)vg.className='vbtn';});

  // Theme
  var tb=document.getElementById('tbtn');
  if(tb) tb.addEventListener('click',function(){
    dark=!dark;
    if(dark)document.documentElement.setAttribute('data-dark','');
    else document.documentElement.removeAttribute('data-dark');
    var ti=document.getElementById('ticon'),tl=document.getElementById('tlbl');
    if(ti)ti.textContent=dark?'☀️':'🌙';
    if(tl)tl.textContent=dark?'Chiaro':'Scuro';
  });

  // FAB + Modal
  var fab=document.getElementById('fab');if(fab)fab.addEventListener('click',openModal);
  var bcanc=document.getElementById('bcanc');if(bcanc)bcanc.addEventListener('click',closeModal);
  var mbg=document.getElementById('mbg');if(mbg)mbg.addEventListener('click',function(e){if(e.target===mbg)closeModal();});
  var badd=document.getElementById('badd');if(badd)badd.addEventListener('click',function(){addIng();});
  var bsave=document.getElementById('bsave');
  if(bsave) bsave.addEventListener('click',function(){
    var name=(document.getElementById('mn').value||'').trim();
    if(!name){alert('Inserisci il nome della ricetta');return;}
    var mc=document.getElementById('mc'),msec=document.getElementById('msec');
    var catV=mc?mc.value:'Altro', secV=msec?msec.value:'colazioni';
    var rows=document.getElementById('ilist').querySelectorAll('.ing-row');
    var ings=[];
    rows.forEach(function(row){
      var ins=row.querySelectorAll('input');
      var iN=(ins[0].value||'').trim(),iQ=ins[1].value?parseFloat(ins[1].value):null,iU=(ins[2].value||'').trim()||'g';
      if(iN) ings.push([iN,iQ,iU]);
    });
    if(!ings.length){alert('Aggiungi almeno un ingrediente');return;}
    saveRecipe({n:name,c:catV,s:secV,i:ings});
    closeModal();
  });

  loadSharedRecipes();
}

/* ─── iOS boot ─── */
var _booted=false;
function iosBoot(){if(_booted)return;_booted=true;init();}
document.addEventListener('DOMContentLoaded',iosBoot);
window.addEventListener('load',iosBoot);
if(document.readyState==='interactive'||document.readyState==='complete') iosBoot();
setTimeout(iosBoot,0);setTimeout(iosBoot,200);setTimeout(iosBoot,800);
</script>
